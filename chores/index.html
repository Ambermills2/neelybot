<script>
/* This app must never be served from a stale cache. Evict any service worker
   (the wall app registers one at "/" whose scope covers /chores) and clear its
   caches; reload once if a worker was actually controlling this page. */
(function(){
  try{
    if('caches' in window){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){
      var wasControlled=!!navigator.serviceWorker.controller;
      navigator.serviceWorker.getRegistrations().then(function(rs){
        var hit=false;
        rs.forEach(function(r){var sc=r.scope||'';if(sc.indexOf('/chores')>=0||location.pathname.indexOf('/chores')>=0){r.unregister();hit=true;}});
        if(hit&&wasControlled&&!sessionStorage.getItem('gc_swbust')){
          sessionStorage.setItem('gc_swbust','1');location.reload(true);
        }
      });
    }
  }catch(e){}
})();
</script>

/* ---------- helpers ---------- */
function pad2(n){return (n<10?'0':'')+n;}
function todayYMD(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function txDate(){try{return new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});}catch(e){return '';}}
function payAmt(s){var m=/([0-9]+(?:\.[0-9]+)?)/.exec(s||'');return m?parseFloat(m[1]):0;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function BREQ(){if(STATE&&!Array.isArray(STATE.BANKREQ))STATE.BANKREQ=[];return (STATE&&STATE.BANKREQ)||[];}
function kids(){return Object.keys(BAL());}

function choreDaysInfo(c){var DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];var days=Array.isArray(c[9])?c[9]:[];var idxs=days.map(function(d){return DOW.indexOf(d);}).filter(function(x){return x>=0;});var win=c[10]||'Today Only';var m=String(win).match(/\d/);var span=m?parseInt(m[0],10):1;if(span<1)span=1;return {idxs:idxs,span:span};}
function scheduledToday(c){var hasDays=Array.isArray(c[9])&&c[9].length>0;if(c[14]&&!hasDays){var n=new Date(),last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),want=Math.min(c[14],last);return n.getDate()===want;}if(c[12]&&!hasDays)return c[12]===todayYMD();var info=choreDaysInfo(c);if(!info.idxs.length)return true;var t=(new Date().getDay()+6)%7;for(var k=0;k<info.idxs.length;k++){if(((t-info.idxs[k])+7)%7<info.span)return true;}return false;}
function nextYMD(s){var p=(s||todayYMD()).split('-');var d=new Date(+p[0],+p[1]-1,+p[2]+1);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
/* c[11] = the ONE extra date this chore was added back for (YMD). Legacy 1/true = today. */
function carryDate(c){var v=c[11];if(!v)return '';if(v===1||v===true)return todayYMD();return String(v);}
function activeToday(c){var cd=carryDate(c);if(cd&&cd===todayYMD())return true;return scheduledToday(c);}
function scheduledOnWd(c,wd){var hasDays=Array.isArray(c[9])&&c[9].length>0;if(c[14]&&!hasDays)return false;if(c[12]&&!hasDays)return false;var info=choreDaysInfo(c);if(!info.idxs.length)return true;for(var k=0;k<info.idxs.length;k++){if(((wd-info.idxs[k])+7)%7<info.span)return true;}return false;}

/* keep the view correct without depending on the wall tablet's nightly reset (same rules as the main app) */
function reconcile(){
  if(!STATE||!STATE.CHORES)return;
  var t=todayYMD(),list=STATE.CHORES,ap=STATE.APPROVALS||[];
  for(var i=0;i<list.length;i++){var c=list[i];if(!c)continue;
    if(c[12]&&Array.isArray(c[9])&&c[9].length){c[12]='';}
    if(!scheduledToday(c))continue;
    var s=c[5];
    if(s==='incomplete'){c[5]='todo';}
    else if((s==='done'||s==='skip'||s==='wait')&&c[13]!==t){c[5]='todo';c[13]='';}
    else if(s==='wait'||s==='skipwait'){
      /* a chore marked done/skipped today MUST have a matching approval — rebuild it if it was lost */
      var ha=false;for(var j=0;j<ap.length;j++){if(ap[j].ci===i&&(!ap[j].date||ap[j].date===t)){ha=true;break;}}
      if(!ha){if(c[13]===t){ap.push({title:c[3],desc:c[7],who:c[0],color:c[1],amt:(s==='skipwait'?0:payAmt(c[4])),ci:i,date:t,skip:(s==='skipwait')});}else{c[5]='todo';c[13]='';}}
    }
  }
}

/* ---------- firebase sync (shares households/main; writes FULL state so nothing else is wiped) ---------- */
function fbInit(){
  try{
    firebase.initializeApp(FB_CONFIG);
    fbAuth=firebase.auth();
    var db=firebase.firestore();
    try{db.enablePersistence({synchronizeTabs:true}).catch(function(){});}catch(e){}
    fbDoc=db.collection('households').doc('main');
    _ready=true;
    fbAuth.onAuthStateChanged(function(u){fbUser=u;if(u){subscribe();}render();});
  }catch(e){console.warn('fbInit',e);}
}
function subscribe(){
  _synced=false;_dirty=false;
  fbDoc.onSnapshot(function(snap){
    if(!snap.exists){_synced=true;return;}
    var data=snap.data();_synced=true;
    if(_dirty)return; // don't clobber an unsaved local edit
    if(data&&data.stateJson){try{STATE=JSON.parse(data.stateJson);}catch(e){}}
    reconcile();render();
  },function(err){console.warn('snapshot',err);});
}
function signIn(){if(!_ready){toast('Still loading…');return;}var p=new firebase.auth.GoogleAuthProvider();fbAuth.signInWithPopup(p).catch(function(e){if(e&&e.code!=='auth/popup-closed-by-user')toast('Sign-in did not finish');});}
function save(){
  if(!fbUser||!_synced||!STATE)return;
  _dirty=true;
  if(_saveT)clearTimeout(_saveT);
  _saveT=setTimeout(function(){
    fbDoc.set({stateJson:JSON.stringify(STATE),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:'grove-chores'},{merge:true})
      .then(function(){_dirty=false;}).catch(function(e){console.warn('save',e);_dirty=false;});
  },600);
}

/* ---------- chore actions ---------- */
function complete(i){var list=CH(),c=list[i];if(!c||c[5]!=='todo')return;var ap=AP(),t=todayYMD();for(var k=ap.length-1;k>=0;k--){if(ap[k].ci===i&&(!ap[k].date||ap[k].date===t))ap.splice(k,1);}c[5]='wait';c[13]=t;ap.push({title:c[3],desc:c[7],who:c[0],color:c[1],amt:payAmt(c[4]),ci:i,date:t});save();if(!refreshRow(i))render();toast(c[3]+' ✓');}
function unComplete(i){var c=CH()[i];if(!c||c[5]!=='wait')return;for(var k=AP().length-1;k>=0;k--){if(AP()[k].ci===i&&!AP()[k].skip)AP().splice(k,1);}c[5]='todo';c[13]='';save();if(!refreshRow(i))render();toast('Undone — back to To-Do');}
function undoDone(i){var c=CH()[i];if(!c||c[5]!=='done')return;var kid=c[0],amt=payAmt(c[4]),b=BAL()[kid];confirmSheet('Un-do "'+esc(c[3])+'"?',(amt>0&&b?'It goes back to To-Do and '+money(amt)+' is taken back from '+esc(kid)+'.':'It goes back to To-Do.'),function(){c[5]='todo';c[13]='';if(amt>0&&b){b.bal-=amt;b.wk=Math.max(0,(b.wk||0)-amt);var tx=TX()[kid];if(tx)tx.unshift(['Undo · '+c[3],txDate(),-amt]);}save();render();toast('Undone'+(amt>0&&b?' · −'+money(amt):''));},'Undo','b-red');}
function skip(i){var c=CH()[i];if(!c||c[5]!=='todo')return;var ap=AP(),t=todayYMD();for(var k=ap.length-1;k>=0;k--){if(ap[k].ci===i&&(!ap[k].date||ap[k].date===t))ap.splice(k,1);}c[5]='skipwait';c[13]=t;ap.push({title:c[3],desc:c[7],who:c[0],color:c[1],amt:0,ci:i,date:t,skip:true});save();if(!refreshRow(i))render();toast(c[3]+' ⏭ skip sent');}
function unskip(i){var c=CH()[i];if(!c||(c[5]!=='skip'&&c[5]!=='skipwait'))return;c[5]='todo';c[13]='';for(var k=AP().length-1;k>=0;k--){if(AP()[k].ci===i&&AP()[k].skip)AP().splice(k,1);}save();if(!refreshRow(i))render();toast('Un-skipped');}

        +'<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:800">'+c[3]+'</div><div style="font-size:11.5px;color:var(--ink3)">'+esc(c[0])+' \u00b7 '+(isSkip?'skip allowed \u2014 no money':'paid '+money(amt))+'</div></div>'
        +'<span class="chip '+(isSkip?'skip':'done')+'" style="font-size:11px;padding:6px 10px">'+(isSkip?'\u23ed Skipped':'\u2713 Paid')+'</span></div>'
        +'<div style="display:flex;margin-top:11px"><button onclick="'+(isSkip?'unskip('+i+')':'undoDone('+i+')')+'" style="flex:1;height:42px;border-radius:11px;border:1.5px solid var(--line);background:none;color:var(--ink2);font-weight:800;font-size:14px">Undo'+(isSkip?'':' \u00b7 take back '+money(amt))+'</button></div>'
        +'</div></div>';
    });
  }
  /* --- bank requests --- */
  out+='<div class="eyebrow" style="margin:18px 0 8px">Bank Requests</div>';
  if(!reqs.length){out+='<div class="card"><div class="in"><div class="empty">No pending requests.</div></div></div>';return out;}
  reqs.forEach(function(r,i){
    var inn=r.dir==='in';
    out+='<div class="card"><div class="in">'
      +'<div style="display:flex;align-items:center;gap:10px"><span class="av" style="width:32px;height:32px;font-size:14px;background:'+(KIDCOL[r.kid]||'#999')+'">'+esc(r.kid[0])+'</span>'
      +'<div style="flex:1;min-width:0"><div style="font-size:15.5px;font-weight:800">'+esc(r.reason)+'</div><div style="font-size:11.5px;color:var(--ink3)">'+esc(r.kid)+' · '+esc(r.when||r.date)+'</div></div>'
      +'<div style="font-size:20px;font-weight:800;color:'+(inn?'var(--saged)':'var(--clayd)')+'">'+(inn?'+':'−')+'$'+r.amt.toFixed(2)+'</div></div>'
      +'<div style="font-size:12.5px;color:var(--ink2);margin-top:9px">'+(inn?'Deposit into':'Withdraw from')+' '+esc(r.kid)+'’s account.</div>'
      +'<div class="acts" style="display:flex;gap:9px;margin-top:12px"><button onclick="declineBank('+i+')" style="flex:1;height:46px;border-radius:12px;border:1.5px solid var(--red);background:none;color:var(--red);font-weight:800;font-size:15px">Decline</button><button onclick="approveBank('+i+')" style="flex:1;height:46px;border-radius:12px;border:none;background:var(--saged);color:#fff;font-weight:800;font-size:15px">Approve</button></div>'
      +'</div></div>';
  });
  return out;
}

/* ---------- hub code gate ---------- */
var _pin='',_pinCB=null;
function gate(msg,cb){_pin='';_pinCB=cb;
  sheetHTML('<h3 style="text-align:center">Hub Code</h3><div style="text-align:center;color:var(--ink3);font-size:12.5px;margin-bottom:6px">'+esc(msg)+'</div>'
    +'<div class="dots" id="dots">'+[0,0,0,0].map(function(){return '<span class="dot"></span>';}).join('')+'</div>'
    +'<div class="pad">'+[1,2,3,4,5,6,7,8,9,'star',0,'⌫'].map(function(k){return k==='star'?'<div class="key" style="color:#9A958B;font-size:24px">★</div>':'<div class="key" onclick="pin(\''+(k==='⌫'?'del':k)+'\')">'+k+'</div>';}).join('')+'</div>'
    +'<div class="row2" style="margin-top:16px"><button class="b-ghost" onclick="closeSheet()">Cancel</button></div>');
}
function pin(k){
  if(k==='del')_pin=_pin.slice(0,-1);else if(_pin.length<4)_pin+=k;
  var dots=document.querySelectorAll('#dots .dot');dots.forEach(function(d,i){d.classList.toggle('f',i<_pin.length);});
  if(_pin.length===4){
    if(_pin===HUBCODE){var cb=_pinCB;_pinCB=null;setTimeout(function(){closeSheet();if(cb)cb();},180);}
    else{setTimeout(function(){_pin='';document.querySelectorAll('#dots .dot').forEach(function(d){d.classList.remove('f');});toast('Wrong Hub Code');},220);}
  }
}

/* ---------- generic sheet / confirm / toast ---------- */
function sheetHTML(h){var m=document.getElementById('modal');var wasOpen=m.classList.contains('show');document.getElementById('sheet').innerHTML=h;m.classList.add('show');if(!wasOpen&&typeof pushNav==='function')pushNav();}
function closeSheet(){document.getElementById('modal').classList.remove('show');}
var _confCB=null;
function confirmSheet(title,msg,cb,label,cls){_confCB=cb;sheetHTML('<h3>'+title+'</h3><div style="font-size:14px;color:var(--ink2);line-height:1.5;margin-bottom:16px">'+msg+'</div><div class="row2"><button class="b-ghost" onclick="closeSheet()">Cancel</button><button class="'+(cls||'b-red')+'" onclick="runConfirm()">'+(label||'Yes')+'</button></div>');}
function runConfirm(){var cb=_confCB;_confCB=null;closeSheet();if(cb)cb();}
var _toastT=null;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');if(_toastT)clearTimeout(_toastT);_toastT=setTimeout(function(){t.classList.remove('show');},2400);}
document.getElementById('modal').addEventListener('click',function(e){if(e.target.id==='modal')closeSheet();});

/* ---------- render ---------- */
function ic(name){var p={home:'M3 11.5 12 4l9 7.5M5.5 10v9.5h13V10',check:'M5 4.5h14v16H5zM9 4.5a3 3 0 0 1 6 0M8.5 12.5l2 2 4-4.5',bank:'M4 9 12 4l8 5M5 9v9h14V9M9 18v-5h6v5',lock:'M5 10.5h14v9H5zM8 10.5V8a4 4 0 0 1 8 0v2.5'}[name]||'';return '<svg viewBox="0 0 24 24"><path d="'+p+'"/></svg>';}
function go(t){TAB=t;pushNav();render();var s=document.querySelector('.stage');if(s)s.scrollTop=0;}
/* --- back-button handling: never exit the app from a sheet or a sub-tab --- */
function pushNav(){try{history.pushState({nb:1,tab:TAB},'');}catch(e){}}
window.addEventListener('popstate',function(){
  var m=document.getElementById('modal');
  if(m&&m.classList.contains('show')){closeSheet();pushNav();return;}   // Back closes an open sheet
  if(TAB!=='chores'){TAB='chores';render();pushNav();return;}           // Back returns to Chores
  pushNav();                                                            // stay in the app
});
try{history.replaceState({nb:1,tab:'chores'},'');history.pushState({nb:1,tab:'chores'},'');}catch(e){}
function setViewDay(d){VIEWDAY=d;render();var st=document.querySelector('.stage');if(st)st.scrollTop=0;}

function render(){
  var app=document.getElementById('app');
  var head='<div class="hdr"><div><div class="t">Gracie’s Grove</div><div class="sub">'+(fbUser?'Chores &amp; Banking':'Sign in to sync')+'</div></div>'+(fbUser?'<span class="who">'+esc((fbUser.displayName||fbUser.email||'').split(' ')[0]||'Synced')+'</span>':'')+'</div>';
  var body;
  if(!fbUser){
    body='<div class="stage"><div class="signin"><h2>Grove Chores</h2><p>Sign in with the family Google account to load Caden &amp; Gavin’s chores and banks. Everything stays in sync with the wall tablet.</p><button class="gbtn" onclick="signIn()">Sign in with Google</button></div><div class="build">Build '+BUILD+'</div></div>';
    app.innerHTML=head+body;return;
  }
  if(!STATE){body='<div class="stage"><div class="card"><div class="in"><div class="empty">Loading your chores…</div></div></div></div>';app.innerHTML=head+body;return;}
  body='<div class="stage">'+(TAB==='chores'?choresView():TAB==='bankapp'?bankAppView():bankView())+'<div class="build">Build '+BUILD+'</div></div>';
  var nreq=BREQ().length+pendingChores().length;
  var nav='<div class="nav"><a href="javascript:void(0)" onclick="go(\'chores\')" class="'+(TAB==='chores'?'on':'')+'">'+ic('check')+'Chores</a>'
    +'<a href="javascript:void(0)" onclick="go(\'bank\')" class="'+(TAB==='bank'?'on':'')+'">'+ic('bank')+'Bank</a>'
    +'<a href="javascript:void(0)" onclick="openBankTab()" class="'+(TAB==='bankapp'?'on':'')+'" style="position:relative">'+ic('lock')+'Approvals'+'<span id="navBadge" style="position:absolute;top:0;right:22%;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#C0553D;color:#fff;font-size:10px;font-weight:800;'+(nreq?'display:flex':'display:none')+';align-items:center;justify-content:center">'+(nreq>9?'9+':nreq)+'</span></a></div>';
  app.innerHTML=head+body+nav;
}

function choreControl(c,i){
  if(c[5]==='wait')return '<span class="chip done" onclick="unComplete('+i+')" title="Tap to undo">✓ Done</span>';
  if(c[5]==='done')return '<span class="chip done" onclick="undoDone('+i+')" title="Tap to undo">✓ Done</span>';
  if(c[5]==='skipwait'||c[5]==='skip')return '<span class="chip skip" onclick="unskip('+i+')" title="Tap to undo">⏭ Skipped</span>';
  if(c[5]==='incomplete')return '<span class="chip inc">Missed</span>';
  return '<button class="skip-x" onclick="skip('+i+')">Skip</button><button class="done-btn btn" onclick="complete('+i+')">✓ Done</button>';
}
function choreRow(c,i){
  var pay=c[4]?'<span class="pay">'+esc(c[4])+'</span>':'';
  var edit='<button class="editbtn" onclick="editChore('+i+')" aria-label="Edit"><svg viewBox="0 0 24 24"><path d="M5 19h3l9.5-9.5-3-3L5 16zM14.5 6.5l3 3"/></svg></button>';
  return '<div class="chore" id="chore-'+i+'"><div class="body"><div class="ttl">'+c[3]+'</div>'+(c[7]?'<div class="desc">'+c[7]+'</div>':'')+'</div>'+pay+'<span class="ctl" id="ctl-'+i+'">'+choreControl(c,i)+'</span>'+edit+'</div>';
}
/* update ONE row in place — avoids a full re-render swallowing rapid taps */
function refreshRow(i){
  var el=document.getElementById('ctl-'+i),c=CH()[i];
  if(!el||!c)return false;
  el.innerHTML=choreControl(c,i);
  var n=BREQ().length+pendingChores().length,b=document.getElementById('navBadge');
  if(b){if(n){b.textContent=n>9?'9+':n;b.style.display='flex';}else{b.style.display='none';}}
  var ban=document.getElementById('apBanner');
  var npc=pendingChores().length;if(ban)ban.style.display=npc?'':'none';
  var cnt=document.getElementById('apCount');if(cnt)cnt.textContent=npc;
  var cnt2=document.getElementById('apCount2');if(cnt2)cnt2.textContent=npc+' waiting';
  return true;
}
function previewRow(c){var pay=c[4]?'<span class="pay">'+esc(c[4])+'</span>':'';return '<div class="chore"><div class="body"><div class="ttl">'+c[3]+'</div>'+(c[7]?'<div class="desc">'+c[7]+'</div>':'')+'</div>'+pay+'</div>';}
function choresView(){
  var list=CH(),ap=AP();
  var DOW3=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var DOWfull=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  var todWd=(new Date().getDay()+6)%7;
  var isToday=(VIEWDAY===-1);
  var wd=isToday?todWd:VIEWDAY;
  var title=isToday?'Today’s Chores':DOWfull[wd]+'’s Chores';
  var sub=isToday?new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}):'What’s scheduled';
  var out='<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px"><div><div style="font-size:22px;font-weight:800;line-height:1">'+title+'</div><div style="font-size:12.5px;color:var(--ink3);margin-top:4px">'+sub+'</div></div><button onclick="addChore()" style="height:44px;padding:0 16px;background:var(--sage);color:#fff;border:none;border-radius:13px;font-size:15px;font-weight:800;flex:none">+ Add</button></div>';
  var dchips=[{v:-1,l:'Today'}];for(var d=0;d<7;d++)dchips.push({v:d,l:DOW3[d]});
  out+='<div class="dayfilter">'+dchips.map(function(c){return '<span class="dchip'+((VIEWDAY===c.v)?' on':'')+'" onclick="setViewDay('+c.v+')">'+c.l+'</span>';}).join('')+'</div>';
  var np=pendingChores().length;if(isToday){out+='<div class="banner" id="apBanner" style="'+(np?'':'display:none')+'"><span class="n" id="apCount">'+np+'</span><div><b id="apCount2">'+np+' waiting</b><div style="font-size:11.5px;color:var(--goldd)">Tap to approve &amp; pay</div></div><span class="go" onclick="openBankTab()">Review</span></div>';}
  var ks=kids();if(!ks.length)ks=['Caden','Gavin'];
  ks.forEach(function(kid){
    var rows=[];
    for(var i=0;i<list.length;i++){var c=list[i];if(!c||c[0]!==kid)continue;var show=isToday?activeToday(c):scheduledOnWd(c,wd);if(show)rows.push(i);}
    var b=BAL()[kid]||{bal:0};
    var col=KIDCOL[kid]||'#999';
    var dollars=Math.floor(b.bal||0),cents=('0'+Math.round(((b.bal||0)-dollars)*100)).slice(-2);
    var inner=rows.length
      ? rows.map(function(i){return isToday?choreRow(list[i],i):previewRow(list[i]);}).join('')
      : '<div class="empty">'+(isToday?'No chores today. 🎉':'No chores on '+DOWfull[wd]+'.')+'</div>';
    out+='<div class="card"><div class="in"><div class="kidhead"><span class="av" style="background:'+col+'">'+esc(kid[0])+'</span><div class="kidname">'+esc(kid)+'</div><div class="kidbal">$'+dollars+'<span class="c">.'+cents+'</span></div></div></div><div class="in" style="padding-top:2px">'+inner+'</div></div>';
  });
  return out;
}

function bankView(){
  var out='',ks=kids();if(!ks.length)ks=['Caden','Gavin'];
  ks.forEach(function(kid){
    var b=BAL()[kid]||{bal:0,wk:0},col=KIDCOL[kid]||'#999';
    var allTx=TX()[kid]||[];var lim=TXSHOW[kid]||8;var tx=allTx.slice(0,lim);
    var dollars=Math.floor(b.bal||0),cents=('0'+Math.round(((b.bal||0)-dollars)*100)).slice(-2);
    var txhtml=tx.length?tx.map(function(t,ti){var amt=Number(t[2])||0;return '<div class="txrow"><div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:700">'+esc(t[0])+'</div><div style="font-size:11px;color:var(--ink3)">'+esc(t[1])+'</div></div><div class="amt" style="color:'+(amt>0?'var(--saged)':'var(--clayd)')+'">'+(amt>0?'+':'−')+'$'+Math.abs(amt).toFixed(2)+'</div><button class="editbtn" style="color:var(--red);border-color:var(--redt);margin-left:8px" onclick="removeTx(\''+esc(kid)+'\','+ti+')" aria-label="Remove"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></button></div>';}).join(''):'<div class="empty">No transactions yet.</div>';
    out+='<div class="card"><div class="in"><div class="kidhead"><span class="av" style="background:'+col+'">'+esc(kid[0])+'</span><div class="kidname">'+esc(kid)+'</div><div class="kidbal">$'+dollars+'<span class="c">.'+cents+'</span></div></div>'
      +'<div style="font-size:12px;color:var(--saged);font-weight:800;margin-top:2px">+'+money(b.wk||0)+' this week</div>'
      +'<div class="moneybtns"><button onclick="bankMove(\''+kid+'\',\'in\')">▲ Deposit</button><button onclick="bankMove(\''+kid+'\',\'out\')">▼ Withdraw</button></div>'
      +'<div class="eyebrow" style="margin:16px 0 2px">Recent</div>'+txhtml
      +(allTx.length>lim?'<div style="text-align:center;padding:12px 0 2px"><span onclick="moreTx(\''+esc(kid)+'\')" style="font-size:13.5px;font-weight:800;color:var(--saged);cursor:pointer">Show more ('+(allTx.length-lim)+' more)</span></div>':'')
      +(lim>8&&allTx.length>8?'<div style="text-align:center;padding:4px 0 2px"><span onclick="lessTx(\''+esc(kid)+'\')" style="font-size:12.5px;font-weight:700;color:var(--ink3);cursor:pointer">Show less</span></div>':'')
      +'</div></div>';
  });
  return out;
}

/* ---------- boot ---------- */
render();
fbInit();
</script>
</body>
</html>
